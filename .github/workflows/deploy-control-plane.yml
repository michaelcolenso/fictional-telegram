name: Deploy Control Plane

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ui/**'
      - 'migrations/**'
      - 'scripts/import_legacy.py'
      - 'config/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-control-plane.yml'

permissions:
  contents: read

concurrency:
  group: paydirt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYDIRT_ADMIN_TOKEN: ${{ secrets.PAYDIRT_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$PAYDIRT_ADMIN_TOKEN" || { echo 'Missing PAYDIRT_ADMIN_TOKEN'; exit 1; }

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Validate application
        run: |
          python -m py_compile scripts/import_legacy.py
          node --check ui/app.js
          npm run typecheck

      - name: Resolve or create production D1
        id: d1
        shell: bash
        run: |
          DATABASE_ID="$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const rows=JSON.parse(s); const db=rows.find(x=>x.name==="paydirt");
              if(db) process.stdout.write(db.uuid || db.id || "");
            });
          ')"
          if [ -z "$DATABASE_ID" ]; then
            npx wrangler d1 create paydirt --location wnam
            DATABASE_ID="$(npx wrangler d1 list --json | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const rows=JSON.parse(s); const db=rows.find(x=>x.name==="paydirt");
                if(db) process.stdout.write(db.uuid || db.id || "");
              });
            ')"
          fi
          test -n "$DATABASE_ID"
          echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"
          echo "Using D1 $DATABASE_ID"

      - name: Prepare production Wrangler configs
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('wrangler.jsonc').read_text()
          source = source.replace('00000000-0000-0000-0000-000000000000', os.environ['DATABASE_ID'])
          Path('.wrangler.production.jsonc').write_text(source)
          secret_block = '  "secrets": {\n    "required": ["PAYDIRT_ADMIN_TOKEN"]\n  },\n'
          Path('.wrangler.bootstrap.jsonc').write_text(source.replace(secret_block, ''))
          PY

      - name: Apply production migrations
        run: npx wrangler d1 migrations apply paydirt --remote --config .wrangler.production.jsonc

      - name: Import legacy state idempotently
        run: |
          python scripts/import_legacy.py > .paydirt-legacy-import.sql
          npx wrangler d1 execute paydirt --remote --config .wrangler.production.jsonc --file=.paydirt-legacy-import.sql

      - name: Bootstrap Worker before secret exists
        run: npx wrangler deploy --config .wrangler.bootstrap.jsonc

      - name: Install admin secret
        run: printf '%s' "$PAYDIRT_ADMIN_TOKEN" | npx wrangler secret put PAYDIRT_ADMIN_TOKEN --config .wrangler.bootstrap.jsonc

      - name: Deploy production Worker
        run: npx wrangler deploy --config .wrangler.production.jsonc
