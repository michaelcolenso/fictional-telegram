name: Control Plane CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'ui/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - '.github/workflows/control-plane-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Validate importer and UI
        run: |
          python -m py_compile scripts/import_legacy.py
          node --check ui/app.js
          python scripts/import_legacy.py > .paydirt-legacy-import.sql
          test -s .paydirt-legacy-import.sql

      - name: Apply D1 schema locally
        run: npm run db:migrate:local

      - name: Seed legacy state locally
        run: npx wrangler d1 execute paydirt --local --file=.paydirt-legacy-import.sql

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Exercise Phase C API
        shell: bash
        run: |
          printf 'PAYDIRT_ADMIN_TOKEN="ci-admin-token"\n' > .dev.vars
          npx wrangler dev --port 8787 > /tmp/paydirt-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID || true; cat /tmp/paydirt-wrangler.log' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health | grep '"mutations":true'

          LEAD_ID=$(curl -fsS http://127.0.0.1:8787/api/leads | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).leads.find(l=>!l.reserved);if(x)process.stdout.write(x.id)})')
          if [ -n "$LEAD_ID" ]; then
            curl -fsS -X POST "http://127.0.0.1:8787/api/leads/$LEAD_ID/promote" \
              -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' \
              --data '{"reason":"CI promotion"}' | grep '"ok":true'
          fi

          OPP_ID=$(curl -fsS http://127.0.0.1:8787/api/opportunities | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const xs=JSON.parse(s).opportunities;const x=xs.find(o=>["SCORED","RESEARCHING","BACKLOG"].includes(o.lifecycle_state));if(x)process.stdout.write(x.id)})')
          test -n "$OPP_ID"
          curl -fsS -X POST "http://127.0.0.1:8787/api/opportunities/$OPP_ID/rescore" \
            -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' --data '{}' | grep '"ok":true'
          curl -fsS -X POST "http://127.0.0.1:8787/api/opportunities/$OPP_ID/build-spec" \
            -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' --data '{}' | grep '"content"'
          curl -fsS -X POST "http://127.0.0.1:8787/api/opportunities/$OPP_ID/decision" \
            -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' \
            --data '{"action":"APPROVE","reason":"CI approval"}' | grep '"to":"APPROVED"'
          curl -fsS http://127.0.0.1:8787/api/portfolio | grep "$OPP_ID"
